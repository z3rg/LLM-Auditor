# LLM Auditor — compose file ada di docker/, konteks build = root repo.
# Jalankan DARI ROOT repo (agar --env-file menemukan ./.env):
#   docker compose -f docker/docker-compose.yml --env-file .env up --build -d
# atau lewat npm: `npm run docker:up`.
#
# Kontainer ini STATELESS: seluruh data ada di Postgres (Neon), jadi tidak ada
# volume. Siapkan skema sekali dari mesin Anda dengan `npm run db:setup`.
name: llm-auditor
services:
  llm-auditor:
    build:
      context: ..              # root repo (relatif terhadap docker/)
      dockerfile: docker/Dockerfile
    image: llm-auditor:latest
    container_name: llm-auditor
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Wajib: Postgres + pgvector (Neon).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi di .env}
      # Wajib untuk fitur AI (AI Gateway EdgeOne Makers, OpenAI-compatible).
      MAKERS_MODELS_KEY: ${MAKERS_MODELS_KEY:-}
      MAKERS_MODEL: ${MAKERS_MODEL:-@makers/deepseek-v4-flash}
      # Jalur alternatif; dipakai otomatis bila kunci Makers kosong.
      AI_PROVIDER: ${AI_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Wajib untuk RAG embedding (Gemini gemini-embedding-001).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
    restart: unless-stopped
