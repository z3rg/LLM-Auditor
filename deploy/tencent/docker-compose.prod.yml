# LLM Auditor — compose produksi untuk Tencent Cloud Lighthouse (Singapore/Jakarta).
#
# Beda dengan docker/docker-compose.yml (dev):
#   - port publik 80 -> 3000 di kontainer, jadi app diakses di http://IP tanpa :3000
#   - log dibatasi agar disk instance kecil tidak penuh
#   - env dibaca dari file .env di folder ini (deploy/tencent/.env)
#
# Kontainer STATELESS: data ada di Postgres (Neon), jadi tidak ada volume dan
# tidak ada yang perlu di-backup dari instance ini.
#
# Jalankan DARI folder ini:
#   docker compose -f docker-compose.prod.yml up --build -d
name: llm-auditor

services:
  llm-auditor:
    build:
      context: ../..                  # root repo (relatif terhadap deploy/tencent/)
      dockerfile: docker/Dockerfile
    image: llm-auditor:prod
    container_name: llm-auditor
    # Bind ke 80 publik. Kontainer tetap dengar di 3000 (lihat Dockerfile).
    ports:
      - "${PUBLIC_PORT:-80}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
